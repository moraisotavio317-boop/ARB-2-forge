name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./arb2-forge-mod.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - run: gradle build
        working-directory: arb2-forge-mod
      - uses: actions/upload-artifact@v4
        with:
          name: arb2-forge-jar
          path: arb2-forge-mod/build/libs/*.jar
